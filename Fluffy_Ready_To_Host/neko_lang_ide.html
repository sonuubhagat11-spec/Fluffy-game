<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekoLang IDE</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        .container { display: flex; gap: 20px; height: 90vh; }
        .editor, .output { flex: 1; display: flex; flex-direction: column; }
        textarea { flex: 1; background-color: #2d2d2d; color: #d4d4d4; font-family: monospace; font-size: 16px; padding: 10px; border: 1px solid #444; border-radius: 5px; resize: none; margin-bottom: 10px; }
        button { padding: 10px 20px; background-color: #007acc; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #005f9e; }
        #game_screen { flex: 2; background-color: #111; border: 2px solid #333; border-radius: 5px; position: relative; overflow: hidden; margin-bottom: 10px; display: flex; flex-direction: column; }
        pre { flex: 1; background-color: #000; color: #0f0; padding: 10px; border-radius: 5px; overflow-y: auto; margin: 0; }
        @keyframes shake {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            25% { transform: translate(-52%, -48%) rotate(2deg); }
            50% { transform: translate(-48%, -52%) rotate(-2deg); }
            75% { transform: translate(-52%, -52%) rotate(2deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
    </style>
</head>
<body>
    <h1>NekoLang IDE (Coding App)</h1>
    <div class="container">
        <div class="editor">
            <h3>Code</h3>
            <textarea id="code">
// NekoLang MVP
name = Hero
print name
load_model hero.obj
anime_effect super_saiyan_aura
            </textarea>
            <button onclick="runCode()">Run Code</button>
        </div>
        <div class="output">
            <h3>Game Screen</h3>
            <div id="game_screen"></div>
            <h3>Console</h3>
            <pre id="console"></pre>
        </div>
    </div>
    <script src="neko_lang.js"></script>
    <script>
        const interpreter = new NekoLang();
        function runCode() {
            const code = document.getElementById('code').value;
            const output = interpreter.run(code);
            document.getElementById('console').textContent = output;
        }
    </script>
</body>
</html>
